[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-miner"
version = "0.1.0"
description = "Halo Strategy voice-of-customer miner (Reddit, Yelp, Google reviews) for Studio Quattro Design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8"]

[project.scripts]
halo-miner = "halo_miner.cli:main"

[tool.setuptools.packages.find]
include = ["halo_miner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
